apiVersion: v1
kind: Service
metadata:
  name: legalai-web
spec:
  selector:
    app: legalai-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: legalai-ai
spec:
  selector:
    app: legalai-ai
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: legalai-db
spec:
  selector:
    app: legalai-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
